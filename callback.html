<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization result</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#0f1115; color:#f0f0f0;
         margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#1a1d24; border:1px solid #2a2f3a; border-radius:16px; padding:40px 48px; max-width:520px; width:92vw; text-align:center; }
  h1 { font-size:22px; margin:0 0 8px; }
  #status { color:#aab; margin-bottom:16px; }
  textarea { width:100%; height:120px; font-family:monospace; font-size:14px; background:#0f1115; color:#7fd6a0;
             border:1px solid #2a2f3a; border-radius:8px; padding:10px; resize:vertical; }
  button { margin-top:12px; padding:10px 22px; border:none; border-radius:8px; background:#4ea1ff; color:#fff;
           font-size:15px; cursor:pointer; }
  button:hover { opacity:.9; }
  .hint { margin-top:14px; font-size:12px; color:#667; }
</style>
</head>
<body>
  <div class="card">
    <h1>Authorization result</h1>
    <p id="status">Processing…</p>
    <textarea id="code" placeholder="" readonly></textarea>
    <br>
    <button id="copy" style="display:none">Copy code</button>
    <p class="hint" id="hint">Copy the code above and paste it into the scheduler tool.</p>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    var err = params.get('error') || params.get('error_description');
    var st = document.getElementById('status');
    var ta = document.getElementById('code');
    var btn = document.getElementById('copy');
    if (code) {
      st.textContent = 'Authorization succeeded. Copy the code below.';
      st.style.color = '#7fd6a0';
      ta.value = code;
      btn.style.display = 'inline-block';
      btn.onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function(){ btn.textContent = 'Copied!'; });
        } else {
          ta.focus(); ta.select();
        }
      };
    } else {
      st.textContent = 'No code received. Authorization may have failed or been declined.';
      ta.value = err || 'missing code parameter';
    }
  </script>
</body>
</html>
